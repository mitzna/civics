<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<title>אזרחות — מעיין שחר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #22223b;
    --border: #2d2d4e;
    --accent-11: #4fc3f7;
    --accent-12: #f06292;
    --accent-both: #a78bfa;
    --text: #e8e8f0;
    --text-muted: #8888aa;
    --radius: 16px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== TOP NAV ===== */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    background: rgba(15,15,26,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .topbar-logo { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; }
  .topbar-logo span { color: var(--accent-both); }
  .teacher-btn {
    font-size: 12px; padding: 6px 12px;
    background: transparent; border: 1px solid var(--border);
    color: var(--text-muted); border-radius: 20px; cursor: pointer;
    font-family: 'Heebo', sans-serif;
    transition: all 0.2s;
  }
  .teacher-btn:hover { border-color: var(--accent-both); color: var(--accent-both); }

  /* ===== SCREENS ===== */
  .screen { display: none; animation: fadeIn 0.3s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

  /* ===== HOME ===== */
  .home-hero {
    text-align: center;
    padding: 52px 24px 36px;
  }
  .home-hero h1 { font-size: 32px; font-weight: 900; line-height: 1.2; margin-bottom: 10px; }
  .home-hero p { color: var(--text-muted); font-size: 15px; margin-bottom: 36px; }

  .class-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 20px; }
  .class-card {
    border-radius: var(--radius);
    padding: 28px 20px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: all 0.25s;
    text-align: center;
  }
  .class-card:hover { transform: translateY(-3px); }
  .class-card.c11 { background: linear-gradient(135deg, #0d2137, #1a3a5c); border-color: var(--accent-11); }
  .class-card.c12 { background: linear-gradient(135deg, #1f0d24, #3d1a4a); border-color: var(--accent-12); }
  .class-card .grade { font-size: 36px; font-weight: 900; margin-bottom: 6px; }
  .class-card.c11 .grade { color: var(--accent-11); }
  .class-card.c12 .grade { color: var(--accent-12); }
  .class-card .label { font-size: 13px; color: var(--text-muted); }
  .class-card .badge {
    display: inline-block; margin-top: 10px;
    font-size: 10px; padding: 3px 10px;
    border-radius: 20px; font-weight: 700;
  }
  .c11 .badge { background: rgba(79,195,247,0.15); color: var(--accent-11); }
  .c12 .badge { background: rgba(240,98,146,0.15); color: var(--accent-12); }

  .section-title {
    font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
    color: var(--text-muted); text-transform: uppercase;
    padding: 28px 20px 12px;
  }

  /* ===== CLASS SCREEN ===== */
  .class-header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
  }
  .class-header .back {
    font-size: 13px; color: var(--text-muted); cursor: pointer;
    margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
  }
  .class-header h2 { font-size: 26px; font-weight: 900; }
  .class-header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  /* Tab bar */
  .tab-bar {
    display: flex; overflow-x: auto;
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    gap: 4px;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0;
    font-family: 'Heebo', sans-serif;
    font-size: 14px; font-weight: 500;
    padding: 14px 16px;
    border: none; background: transparent;
    color: var(--text-muted); cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--active-color, var(--accent-both)); }

  /* ===== TOPICS ===== */
  .topic-list { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .topic-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .topic-card:hover { border-color: var(--active-color, var(--accent-both)); background: var(--surface2); }
  .topic-card h4 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .topic-card p { font-size: 12px; color: var(--text-muted); }
  .topic-card .resources { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .resource-link {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; padding: 5px 10px;
    border-radius: 20px; border: 1px solid var(--border);
    color: var(--text-muted); text-decoration: none;
    transition: all 0.2s;
  }
  .resource-link:hover { border-color: var(--active-color); color: var(--active-color); }

  /* ===== PRACTICE ===== */
  .practice-area { padding: 16px; }
  .topic-picker {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 14px;
    color: var(--text); font-family: 'Heebo', sans-serif; font-size: 14px;
    width: 100%; margin-bottom: 14px; appearance: none;
  }
  .question-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 14px;
  }
  .question-card .q-num { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .question-card .q-text { font-size: 16px; font-weight: 600; line-height: 1.5; margin-bottom: 16px; }
  .answer-opts { display: flex; flex-direction: column; gap: 8px; }
  .answer-opt {
    padding: 12px 16px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: transparent;
    color: var(--text); font-family: 'Heebo', sans-serif; font-size: 14px;
    cursor: pointer; text-align: right; transition: all 0.2s;
  }
  .answer-opt:hover { border-color: var(--active-color); background: rgba(255,255,255,0.04); }
  .answer-opt.correct { border-color: #4caf50; background: rgba(76,175,80,0.12); color: #81c784; }
  .answer-opt.wrong { border-color: #ef5350; background: rgba(239,83,80,0.12); color: #ef9a9a; }
  .answer-opt.disabled { pointer-events: none; }
  .explanation {
    margin-top: 14px; padding: 12px 14px;
    background: rgba(255,255,255,0.04); border-radius: var(--radius-sm);
    font-size: 13px; color: var(--text-muted); line-height: 1.6;
    border-right: 3px solid var(--active-color);
  }
  .next-btn {
    width: 100%; padding: 14px; margin-top: 12px;
    border-radius: var(--radius-sm); border: none;
    background: var(--active-color); color: #fff;
    font-family: 'Heebo', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: opacity 0.2s;
  }
  .next-btn:hover { opacity: 0.85; }
  .ai-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; padding: 3px 8px; border-radius: 20px;
    background: rgba(167,139,250,0.15); color: var(--accent-both);
    margin-bottom: 10px;
  }

  /* ===== FEED ===== */
  .feed { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
  .feed-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: border-color 0.2s;
  }
  .feed-card:hover { border-color: var(--active-color); }
  .feed-card-body { padding: 16px; }
  .feed-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .feed-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; }
  .feed-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 12px; }
  .feed-link {
    display: inline-block; font-size: 12px; color: var(--active-color);
    text-decoration: none; font-weight: 600;
  }
  .feed-link:hover { text-decoration: underline; }
  .feed-reactions { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); }
  .reaction-btn {
    background: transparent; border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 12px;
    font-family: 'Heebo', sans-serif; font-size: 12px;
    color: var(--text-muted); cursor: pointer; transition: all 0.2s;
  }
  .reaction-btn:hover, .reaction-btn.active {
    border-color: var(--active-color); color: var(--active-color);
    background: rgba(255,255,255,0.04);
  }
  .comment-area { padding: 0 16px 14px; }
  .comments { margin-bottom: 10px; }
  .comment { font-size: 12px; color: var(--text-muted); padding: 6px 0; border-bottom: 1px solid var(--border); }
  .comment:last-child { border-bottom: none; }
  .comment-form { display: flex; gap: 8px; }
  .comment-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 12px;
    color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px;
  }
  .comment-input:focus { outline: none; border-color: var(--active-color); }
  .comment-send {
    background: var(--active-color); border: none;
    border-radius: var(--radius-sm); padding: 8px 14px;
    color: #fff; font-family: 'Heebo', sans-serif; font-size: 13px;
    cursor: pointer;
  }

  /* ===== TEACHER PANEL ===== */
  .teacher-panel {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    align-items: flex-end; justify-content: center;
  }
  .teacher-panel.open { display: flex; }
  .teacher-sheet {
    background: var(--surface); border-radius: 24px 24px 0 0;
    width: 100%; max-width: 600px; max-height: 90vh;
    overflow-y: auto; padding: 24px 20px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .sheet-header h3 { font-size: 20px; font-weight: 900; }
  .close-btn { background: var(--surface2); border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; color: var(--text); font-size: 18px; }

  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
  .form-control {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 14px;
    color: var(--text); font-family: 'Heebo', sans-serif; font-size: 14px;
  }
  .form-control:focus { outline: none; border-color: var(--accent-both); }
  textarea.form-control { min-height: 80px; resize: vertical; }
  .submit-btn {
    width: 100%; padding: 14px; border: none;
    background: linear-gradient(135deg, #a78bfa, #7c3aed);
    color: #fff; font-family: 'Heebo', sans-serif; font-size: 15px; font-weight: 700;
    border-radius: var(--radius-sm); cursor: pointer; margin-top: 6px;
  }
  .submit-btn:hover { opacity: 0.9; }

  /* Password overlay */
  .pass-overlay {
    text-align: center; padding: 20px 0;
  }
  .pass-overlay h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .pass-row { display: flex; gap: 8px; }
  .pass-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 14px;
    color: var(--text); font-family: 'Heebo', sans-serif; font-size: 14px;
  }
  .pass-submit {
    background: var(--accent-both); border: none;
    border-radius: var(--radius-sm); padding: 10px 16px;
    color: #fff; font-family: 'Heebo', sans-serif; cursor: pointer;
  }
  .pass-error { color: #ef5350; font-size: 12px; margin-top: 8px; }

  .tabs-content { }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Loading spinner */
  .spinner {
    display: flex; justify-content: center; padding: 30px;
  }
  .spinner::after {
    content: ''; width: 32px; height: 32px;
    border: 3px solid var(--border); border-top-color: var(--accent-both);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center; padding: 48px 20px;
    color: var(--text-muted); font-size: 14px;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

  /* Score */
  .score-banner {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; text-align: center; margin-bottom: 14px;
  }
  .score-banner .big { font-size: 48px; font-weight: 900; color: var(--active-color); }
  .score-banner p { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

  .tag {
    display: inline-block; font-size: 10px; padding: 2px 8px;
    border-radius: 10px; background: rgba(255,255,255,0.07);
    color: var(--text-muted); margin-bottom: 6px;
  }

  /* Share button */
  .share-btn {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--text-muted); background: none; border: none;
    cursor: pointer; font-family: 'Heebo', sans-serif; padding: 0;
  }
  .share-btn:hover { color: var(--active-color); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">אזרחות <span>מעיין שחר</span></div>
  <button class="teacher-btn" onclick="openTeacher()">🔐 מורה</button>
</div>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div class="home-hero">
    <h1>שיעורי אזרחות<br>בכיס 📱</h1>
    <p>בחר את כיתתך כדי להתחיל</p>
  </div>
  <div class="class-grid">
    <div class="class-card c11" onclick="openClass('11')">
      <div class="grade">י"א</div>
      <div class="label">תכנית חדשה</div>
      <div class="badge">5 נושאים</div>
    </div>
    <div class="class-card c12" onclick="openClass('12')">
      <div class="grade">י"ב</div>
      <div class="label">תכנית ישנה</div>
      <div class="badge">6 נושאים</div>
    </div>
  </div>
  <div class="section-title">עדכוני המורה</div>
  <div id="home-feed-preview" class="feed"></div>
</div>

<!-- CLASS SCREEN -->
<div id="screen-class" class="screen">
  <div class="class-header">
    <div class="back" onclick="goHome()">← חזרה</div>
    <h2 id="class-title"></h2>
    <p id="class-subtitle"></p>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('topics')">📚 חומר</button>
    <button class="tab-btn" onclick="switchTab('practice')">✏️ תרגול</button>
    <button class="tab-btn" onclick="switchTab('feed')">📰 עדכונים</button>
  </div>
  <div class="tabs-content">
    <div id="tab-topics" class="tab-panel active">
      <div id="topics-list" class="topic-list"></div>
    </div>
    <div id="tab-practice" class="tab-panel">
      <div class="practice-area">
        <select id="practice-topic-select" class="topic-picker" onchange="loadQuestion()">
          <option value="">— בחר נושא לתרגול —</option>
        </select>
        <div id="practice-content"></div>
      </div>
    </div>
    <div id="tab-feed" class="tab-panel">
      <div id="class-feed" class="feed"></div>
    </div>
  </div>
</div>

<!-- TEACHER PANEL -->
<div id="teacher-panel" class="teacher-panel" onclick="closeTeacherOutside(event)">
  <div class="teacher-sheet">
    <div id="teacher-pass-view">
      <div class="pass-overlay">
        <h3>🔐 כניסת מורה</h3>
        <div class="pass-row">
          <input type="password" class="pass-input" id="pass-input" placeholder="סיסמה" onkeydown="if(event.key==='Enter')checkPass()">
          <button class="pass-submit" onclick="checkPass()">כניסה</button>
        </div>
        <div class="pass-error" id="pass-error"></div>
      </div>
    </div>
    <div id="teacher-main-view" style="display:none;">
      <div class="sheet-header">
        <h3>🛠 פאנל מורה</h3>
        <button class="close-btn" onclick="closeTeacher()">×</button>
      </div>

      <!-- Add Update -->
      <div class="section-title" style="padding:0 0 10px;">➕ פרסום עדכון</div>
      <div class="form-group">
        <label>כיתה</label>
        <select class="form-control" id="t-class">
          <option value="both">שתיהן</option>
          <option value="11">י"א</option>
          <option value="12">י"ב</option>
        </select>
      </div>
      <div class="form-group">
        <label>כותרת</label>
        <input type="text" class="form-control" id="t-title" placeholder="למשל: כתבה מעניינת על זכויות אדם">
      </div>
      <div class="form-group">
        <label>תיאור קצר</label>
        <textarea class="form-control" id="t-desc" placeholder="קצר ולעניין..."></textarea>
      </div>
      <div class="form-group">
        <label>קישור (אופציונלי)</label>
        <input type="url" class="form-control" id="t-url" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>תגית</label>
        <input type="text" class="form-control" id="t-tag" placeholder="כתבה / וידאו / פסיקה / אחר">
      </div>
      <button class="submit-btn" onclick="addUpdate()">פרסם עדכון</button>

      <!-- Add Topic -->
      <div class="section-title" style="padding:20px 0 10px;">📚 הוספת נושא / חומר</div>
      <div class="form-group">
        <label>כיתה</label>
        <select class="form-control" id="t-topic-class">
          <option value="11">י"א</option>
          <option value="12">י"ב</option>
        </select>
      </div>
      <div class="form-group">
        <label>שם הנושא</label>
        <input type="text" class="form-control" id="t-topic-name" placeholder="למשל: הזכות לשוויון">
      </div>
      <div class="form-group">
        <label>תיאור קצר</label>
        <input type="text" class="form-control" id="t-topic-desc" placeholder="מה נלמד בנושא זה?">
      </div>
      <div class="form-group">
        <label>קישורים (מופרדים בפסיק)</label>
        <input type="text" class="form-control" id="t-topic-links" placeholder="מצגת:https://..., מאמר:https://...">
      </div>
      <button class="submit-btn" onclick="addTopic()">הוסף נושא</button>

      <!-- Add Question -->
      <div class="section-title" style="padding:20px 0 10px;">❓ הוספת שאלת תרגול</div>
      <div class="form-group">
        <label>כיתה</label>
        <select class="form-control" id="t-q-class" onchange="updateQTopicList()">
          <option value="11">י"א</option>
          <option value="12">י"ב</option>
        </select>
      </div>
      <div class="form-group">
        <label>נושא</label>
        <select class="form-control" id="t-q-topic"></select>
      </div>
      <div class="form-group">
        <label>שאלה</label>
        <textarea class="form-control" id="t-q-text" placeholder="כתוב את השאלה..."></textarea>
      </div>
      <div class="form-group">
        <label>תשובה א</label><input type="text" class="form-control" id="t-q-a" placeholder="">
      </div>
      <div class="form-group">
        <label>תשובה ב</label><input type="text" class="form-control" id="t-q-b" placeholder="">
      </div>
      <div class="form-group">
        <label>תשובה ג</label><input type="text" class="form-control" id="t-q-c" placeholder="">
      </div>
      <div class="form-group">
        <label>תשובה ד</label><input type="text" class="form-control" id="t-q-d" placeholder="">
      </div>
      <div class="form-group">
        <label>תשובה נכונה</label>
        <select class="form-control" id="t-q-correct">
          <option value="0">א</option><option value="1">ב</option>
          <option value="2">ג</option><option value="3">ד</option>
        </select>
      </div>
      <div class="form-group">
        <label>הסבר (אופציונלי)</label>
        <textarea class="form-control" id="t-q-explain" placeholder="הסבר לתשובה הנכונה..."></textarea>
      </div>
      <button class="submit-btn" onclick="addQuestion()">הוסף שאלה</button>
    </div>
  </div>
</div>

<script>
// ============ DATA ============
const TEACHER_PASS = "maayan2025";

let currentClass = null;
let currentTab = 'topics';
let currentQuestions = [];
let currentQIndex = 0;
let score = 0;
let answered = false;

// Persistent storage using localStorage
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
function load(key, def) { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }

// Initial data
const defaultTopics = {
  "11": [
    { name: "מהי דמוקרטיה?", desc: "ערכי יסוד, עקרונות ושיטות שלטון", links: [{ label: "מצגת", url: "#" }] },
    { name: "זכויות אדם ואזרח", desc: "הזכויות המוגנות בחוק הישראלי", links: [] },
    { name: "הפרדת רשויות", desc: "מחוקק, מבצע ושופט", links: [] },
    { name: "חברה אזרחית", desc: "ארגוני המגזר השלישי ותפקידם", links: [] },
    { name: "דמוקרטיה ישראלית", desc: "ייחודיות ואתגרים", links: [] },
  ],
  "12": [
    { name: "מדינת ישראל — יסודות", desc: "הצהרת העצמאות וחוקי היסוד", links: [] },
    { name: "הכנסת", desc: "הרכב, סמכויות ותפקיד", links: [] },
    { name: "הממשלה", desc: "מבנה, סמכות ואחריות", links: [] },
    { name: "בית המשפט העליון", desc: "שפיטה, ביקורת שיפוטית ועתירות", links: [] },
    { name: "זהות ושסעים", desc: "שסעים חברתיים בחברה הישראלית", links: [] },
    { name: "מדיניות ציבורית", desc: "תהליך קבלת החלטות ממשלתיות", links: [] },
  ]
};

const defaultQuestions = {
  "11": {},
  "12": {}
};

const defaultFeed = [];

let topics = load('civ_topics', defaultTopics);
let questions = load('civ_questions', defaultQuestions);
let feed = load('civ_feed', defaultFeed);

function saveAll() {
  save('civ_topics', topics);
  save('civ_questions', questions);
  save('civ_feed', feed);
}

// ============ NAVIGATION ============
function openClass(cls) {
  currentClass = cls;
  const colors = { '11': 'var(--accent-11)', '12': 'var(--accent-12)' };
  document.documentElement.style.setProperty('--active-color', colors[cls]);
  document.getElementById('class-title').textContent = cls === '11' ? 'כיתה י"א' : 'כיתה י"ב';
  document.getElementById('class-subtitle').textContent = cls === '11' ? 'תכנית חדשה' : 'תכנית ישנה';
  switchTab('topics');
  showScreen('screen-class');
  renderTopics();
  renderFeed('class-feed');
}

function goHome() {
  showScreen('screen-home');
  renderFeed('home-feed-preview', 3);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['topics','practice','feed'][i] === tab);
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'practice') renderPractice();
  if (tab === 'feed') renderFeed('class-feed');
}

// ============ TOPICS ============
function renderTopics() {
  const list = document.getElementById('topics-list');
  const t = topics[currentClass] || [];
  if (!t.length) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📚</div>עדיין אין נושאים. המורה יוסיף בקרוב.</div>';
    return;
  }
  list.innerHTML = t.map((topic, i) => `
    <div class="topic-card">
      <h4>${topic.name}</h4>
      <p>${topic.desc}</p>
      ${topic.links && topic.links.length ? `<div class="resources">
        ${topic.links.map(l => `<a class="resource-link" href="${l.url}" target="_blank">🔗 ${l.label}</a>`).join('')}
      </div>` : ''}
    </div>
  `).join('');
}

// ============ PRACTICE ============
function renderPractice() {
  const sel = document.getElementById('practice-topic-select');
  sel.innerHTML = '<option value="">— בחר נושא לתרגול —</option>';
  (topics[currentClass] || []).forEach((t, i) => {
    sel.innerHTML += `<option value="${i}">${t.name}</option>`;
  });
  document.getElementById('practice-content').innerHTML = '';
  currentQuestions = [];
}

function loadQuestion() {
  const sel = document.getElementById('practice-topic-select');
  const topicIdx = sel.value;
  if (topicIdx === '') { document.getElementById('practice-content').innerHTML = ''; return; }
  const topicName = topics[currentClass][topicIdx]?.name || '';
  const manualQs = (questions[currentClass][topicIdx] || []);
  currentQuestions = [...manualQs];
  score = 0;
  currentQIndex = 0;
  showCurrentQuestion(topicName);
}

function showCurrentQuestion(topicName) {
  const area = document.getElementById('practice-content');
  if (!currentQuestions.length) {
    area.innerHTML = `
      <div class="ai-badge">✨ AI</div>
      <div id="ai-loading" class="spinner"></div>
    `;
    generateAIQuestion(topicName);
    return;
  }
  renderQuestion(currentQuestions[currentQIndex], currentQIndex, currentQuestions.length, topicName);
}

function renderQuestion(q, idx, total, topicName) {
  answered = false;
  const area = document.getElementById('practice-content');
  const isAI = q._ai;
  area.innerHTML = `
    ${isAI ? '<div class="ai-badge">✨ נוצר ע"י AI</div>' : ''}
    <div class="score-banner" style="display:${idx>0?'block':'none'}">
      <div class="big">${score}/${idx}</div>
      <p>ניקוד עד כה</p>
    </div>
    <div class="question-card">
      <div class="q-num">שאלה ${idx + 1}${total ? ' מתוך ' + total : ''}</div>
      <div class="q-text">${q.text}</div>
      <div class="answer-opts" id="opts">
        ${q.options.map((o, i) => `
          <button class="answer-opt" onclick="checkAnswer(${i}, ${q.correct}, this)">
            ${'אבגד'[i]}. ${o}
          </button>
        `).join('')}
      </div>
      <div id="explanation" style="display:none" class="explanation">${q.explanation || ''}</div>
    </div>
    <button class="next-btn" id="next-btn" style="display:none" onclick="nextQuestion('${topicName}')">
      ${idx + 1 >= total && total > 0 ? 'סיום וסיכום' : 'שאלה הבאה ←'}
    </button>
  `;
}

function checkAnswer(chosen, correct, btn) {
  if (answered) return;
  answered = true;
  const opts = document.querySelectorAll('.answer-opt');
  opts.forEach((o, i) => {
    o.classList.add('disabled');
    if (i === correct) o.classList.add('correct');
    else if (i === chosen) o.classList.add('wrong');
  });
  if (chosen === correct) score++;
  const exp = document.getElementById('explanation');
  if (exp.textContent.trim()) exp.style.display = 'block';
  document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion(topicName) {
  currentQIndex++;
  if (currentQIndex >= currentQuestions.length) {
    // Try AI question
    const area = document.getElementById('practice-content');
    area.innerHTML = `<div class="ai-badge">✨ AI</div><div class="spinner"></div>`;
    generateAIQuestion(topicName);
  } else {
    renderQuestion(currentQuestions[currentQIndex], currentQIndex, currentQuestions.length, topicName);
  }
}

async function generateAIQuestion(topicName) {
  try {
    const systemPrompt = `אתה מומחה לאזרחות ישראלית. צור שאלת תרגול לבגרות באזרחות בנושא: "${topicName}".
החזר JSON בפורמט בלבד (ללא גרשיים חיצוניים, ללא markdown):
{
  "text": "השאלה כאן",
  "options": ["תשובה א", "תשובה ב", "תשובה ג", "תשובה ד"],
  "correct": 0,
  "explanation": "הסבר קצר"
}
הצג רק JSON תקין.`;

    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: systemPrompt }]
      })
    });
    const data = await resp.json();
    const raw = data.content.find(c => c.type === 'text')?.text || '';
    const clean = raw.replace(/```json|```/g, '').trim();
    const q = JSON.parse(clean);
    q._ai = true;
    currentQuestions.push(q);
    renderQuestion(q, currentQIndex, 0, topicName);
  } catch (e) {
    document.getElementById('practice-content').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        לא הצלחתי לטעון שאלת AI. נסה שוב.
        <br><br>
        <button class="next-btn" onclick="loadQuestion()" style="display:inline-block;width:auto;padding:10px 20px">נסה שוב</button>
      </div>`;
  }
}

// ============ FEED ============
function renderFeed(containerId, limit) {
  const el = document.getElementById(containerId);
  let items = feed.filter(f => {
    if (containerId === 'home-feed-preview') return true; // show all in home
    return f.forClass === 'both' || f.forClass === currentClass;
  });
  if (limit) items = items.slice(0, limit);
  if (!items.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">📰</div>אין עדכונים עדיין</div>';
    return;
  }
  el.innerHTML = items.map((item, i) => `
    <div class="feed-card">
      <div class="feed-card-body">
        ${item.tag ? `<span class="tag">${item.tag}</span>` : ''}
        <div class="feed-meta">${item.date} · ${item.forClass === 'both' ? 'לשתי הכיתות' : 'כיתה י"' + item.forClass}</div>
        <div class="feed-title">${item.title}</div>
        <div class="feed-desc">${item.desc}</div>
        ${item.url ? `<a class="feed-link" href="${item.url}" target="_blank">קרא עוד ←</a>` : ''}
      </div>
      <div class="feed-reactions">
        <button class="reaction-btn ${item.reactions?.thumbs ? 'active' : ''}" onclick="react(${i}, 'thumbs', '${containerId}')">👍 ${item.reactions?.thumbs || 0}</button>
        <button class="reaction-btn ${item.reactions?.fire ? 'active' : ''}" onclick="react(${i}, 'fire', '${containerId}')">🔥 ${item.reactions?.fire || 0}</button>
        <button class="reaction-btn" onclick="toggleComments(${i}, '${containerId}')">💬 ${(item.comments||[]).length}</button>
        <button class="share-btn" onclick="shareItem(${i})">⬆️ שתף</button>
      </div>
      <div id="comments-${containerId}-${i}" style="display:none" class="comment-area">
        <div class="comments" id="comments-list-${containerId}-${i}">
          ${(item.comments||[]).map(c => `<div class="comment">💬 ${c}</div>`).join('')}
        </div>
        <div class="comment-form">
          <input class="comment-input" id="ci-${containerId}-${i}" placeholder="הגב..." onkeydown="if(event.key==='Enter')submitComment(${i},'${containerId}')">
          <button class="comment-send" onclick="submitComment(${i},'${containerId}')">שלח</button>
        </div>
      </div>
    </div>
  `).join('');
}

function react(idx, type, containerId) {
  if (!feed[idx].reactions) feed[idx].reactions = {};
  feed[idx].reactions[type] = (feed[idx].reactions[type] || 0) + 1;
  saveAll();
  renderFeed(containerId);
}

function toggleComments(idx, containerId) {
  const el = document.getElementById(`comments-${containerId}-${idx}`);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function submitComment(idx, containerId) {
  const inp = document.getElementById(`ci-${containerId}-${idx}`);
  const text = inp.value.trim();
  if (!text) return;
  if (!feed[idx].comments) feed[idx].comments = [];
  feed[idx].comments.push(text);
  inp.value = '';
  saveAll();
  renderFeed(containerId);
  // Re-open comments
  setTimeout(() => {
    const el = document.getElementById(`comments-${containerId}-${idx}`);
    if (el) el.style.display = 'block';
  }, 50);
}

function shareItem(idx) {
  const item = feed[idx];
  if (navigator.share) {
    navigator.share({ title: item.title, text: item.desc, url: item.url || window.location.href });
  } else {
    navigator.clipboard.writeText(item.url || window.location.href);
    alert('הקישור הועתק!');
  }
}

// ============ TEACHER ============
let teacherUnlocked = false;

function openTeacher() {
  document.getElementById('teacher-panel').classList.add('open');
  if (!teacherUnlocked) {
    document.getElementById('teacher-pass-view').style.display = 'block';
    document.getElementById('teacher-main-view').style.display = 'none';
  }
  updateQTopicList();
}

function closeTeacher() {
  document.getElementById('teacher-panel').classList.remove('open');
}

function closeTeacherOutside(e) {
  if (e.target === document.getElementById('teacher-panel')) closeTeacher();
}

function checkPass() {
  const val = document.getElementById('pass-input').value;
  if (val === TEACHER_PASS) {
    teacherUnlocked = true;
    document.getElementById('teacher-pass-view').style.display = 'none';
    document.getElementById('teacher-main-view').style.display = 'block';
  } else {
    document.getElementById('pass-error').textContent = 'סיסמה שגויה';
  }
}

function addUpdate() {
  const cls = document.getElementById('t-class').value;
  const title = document.getElementById('t-title').value.trim();
  const desc = document.getElementById('t-desc').value.trim();
  const url = document.getElementById('t-url').value.trim();
  const tag = document.getElementById('t-tag').value.trim();
  if (!title || !desc) { alert('מלא כותרת ותיאור'); return; }
  const now = new Date();
  feed.unshift({
    title, desc, url, tag,
    forClass: cls,
    date: now.toLocaleDateString('he-IL'),
    reactions: { thumbs: 0, fire: 0 },
    comments: []
  });
  saveAll();
  document.getElementById('t-title').value = '';
  document.getElementById('t-desc').value = '';
  document.getElementById('t-url').value = '';
  document.getElementById('t-tag').value = '';
  renderFeed('home-feed-preview', 3);
  if (currentClass) renderFeed('class-feed');
  alert('✅ העדכון פורסם!');
}

function addTopic() {
  const cls = document.getElementById('t-topic-class').value;
  const name = document.getElementById('t-topic-name').value.trim();
  const desc = document.getElementById('t-topic-desc').value.trim();
  const linksRaw = document.getElementById('t-topic-links').value.trim();
  if (!name) { alert('הכנס שם נושא'); return; }
  const links = linksRaw ? linksRaw.split(',').map(l => {
    const parts = l.trim().split(':');
    return { label: parts[0], url: parts.slice(1).join(':') };
  }) : [];
  topics[cls].push({ name, desc, links });
  saveAll();
  document.getElementById('t-topic-name').value = '';
  document.getElementById('t-topic-desc').value = '';
  document.getElementById('t-topic-links').value = '';
  updateQTopicList();
  if (currentClass === cls) renderTopics();
  alert('✅ הנושא נוסף!');
}

function updateQTopicList() {
  const cls = document.getElementById('t-q-class')?.value || '11';
  const sel = document.getElementById('t-q-topic');
  if (!sel) return;
  sel.innerHTML = (topics[cls] || []).map((t, i) => `<option value="${i}">${t.name}</option>`).join('');
}

function addQuestion() {
  const cls = document.getElementById('t-q-class').value;
  const topicIdx = document.getElementById('t-q-topic').value;
  const text = document.getElementById('t-q-text').value.trim();
  const a = document.getElementById('t-q-a').value.trim();
  const b = document.getElementById('t-q-b').value.trim();
  const c = document.getElementById('t-q-c').value.trim();
  const d = document.getElementById('t-q-d').value.trim();
  const correct = parseInt(document.getElementById('t-q-correct').value);
  const explanation = document.getElementById('t-q-explain').value.trim();
  if (!text || !a || !b || !c || !d) { alert('מלא את כל השדות'); return; }
  if (!questions[cls][topicIdx]) questions[cls][topicIdx] = [];
  questions[cls][topicIdx].push({ text, options: [a,b,c,d], correct, explanation });
  saveAll();
  document.getElementById('t-q-text').value = '';
  ['a','b','c','d'].forEach(l => document.getElementById('t-q-' + l).value = '');
  document.getElementById('t-q-explain').value = '';
  alert('✅ השאלה נוספה!');
}

// ============ INIT ============
renderFeed('home-feed-preview', 3);
</script>
