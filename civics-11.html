<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אזרחות י״א — לאומיות וזכויות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1c2128;
  --border: #30363d;
  --accent: #4fc3f7;
  --accent2: #a78bfa;
  --green: #56d364;
  --red: #f85149;
  --yellow: #e3b341;
  --text: #e6edf3;
  --muted: #7d8590;
  --r: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* TOPBAR */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px;
  background: rgba(13,17,23,0.95); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.logo { font-weight: 900; font-size: 16px; }
.logo em { color: var(--accent); font-style: normal; }
.teacher-btn {
  font-size: 11px; padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); cursor: pointer; font-family: 'Heebo', sans-serif;
  transition: all .2s;
}
.teacher-btn:hover { border-color: var(--accent2); color: var(--accent2); }

/* SCREENS */
.screen { display: none; animation: fadeUp .25s ease; }
.screen.on { display: block; }
@keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

/* HOME */
.hero { padding: 36px 18px 24px; text-align: center; }
.hero h1 { font-size: 28px; font-weight: 900; line-height: 1.2; margin-bottom: 8px; }
.hero p { color: var(--muted); font-size: 14px; }
.class-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 18px; }
.class-card {
  border-radius: var(--r); padding: 24px 16px; text-align: center;
  border: 1px solid var(--border); cursor: pointer; transition: all .2s;
  position: relative; overflow: hidden;
}
.class-card::before { content: ''; position: absolute; inset: 0; opacity: .07; }
.class-card.c11::before { background: var(--accent); }
.class-card.c12::before { background: #f06292; }
.class-card:hover { transform: translateY(-2px); }
.class-card.c11 { border-color: rgba(79,195,247,.3); }
.class-card.c12 { border-color: rgba(240,98,146,.3); }
.grade { font-size: 32px; font-weight: 900; margin-bottom: 4px; }
.c11 .grade { color: var(--accent); }
.c12 .grade { color: #f06292; }
.grade-label { font-size: 12px; color: var(--muted); }
.grade-badge { display: inline-block; margin-top: 8px; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
.c11 .grade-badge { background: rgba(79,195,247,.15); color: var(--accent); }
.c12 .grade-badge { background: rgba(240,98,146,.15); color: #f06292; }

.sec-label { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; padding: 24px 18px 10px; }
.feed-preview { padding: 0 18px 24px; display: flex; flex-direction: column; gap: 10px; }

/* CLASS SCREEN */
.class-header { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); }
.back { font-size: 12px; color: var(--muted); cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
.back:hover { color: var(--text); }
.class-header h2 { font-size: 24px; font-weight: 900; }
.class-header p { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* TABS */
.tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 14px; gap: 2px; overflow-x: auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; font-family: 'Heebo', sans-serif; font-size: 13px; font-weight: 500;
  padding: 12px 14px; border: none; background: transparent;
  color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s;
}
.tab.on { color: var(--text); }
.tab.on.t11 { border-color: var(--accent); }
.tab.on.t12 { border-color: #f06292; }

/* PANELS */
.panel { display: none; }
.panel.on { display: block; }

/* TOPICS */
.topics { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.topic-item {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 14px 16px;
  cursor: pointer; transition: all .2s;
}
.topic-item:hover { border-color: var(--ac); background: var(--surface2); }
.topic-item .t-num { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
.topic-item h4 { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
.topic-item p { font-size: 12px; color: var(--muted); line-height: 1.5; }
.topic-item .t-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.t-link {
  font-size: 11px; padding: 4px 10px; border-radius: 20px;
  border: 1px solid var(--border); color: var(--muted);
  text-decoration: none; transition: all .2s; display: inline-flex; align-items: center; gap: 4px;
}
.t-link:hover { border-color: var(--ac); color: var(--ac); }

/* TOPIC DETAIL */
.topic-detail { padding: 16px 18px; }
.topic-detail .td-back { font-size: 12px; color: var(--muted); cursor: pointer; margin-bottom: 14px; display: flex; align-items: center; gap: 4px; }
.topic-detail .td-back:hover { color: var(--text); }
.td-title { font-size: 20px; font-weight: 900; margin-bottom: 6px; }
.td-desc { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
.td-concepts { display: flex; flex-direction: column; gap: 8px; }
.concept-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; }
.concept-card h5 { font-size: 13px; font-weight: 700; color: var(--ac); margin-bottom: 6px; }
.concept-card p { font-size: 12px; color: var(--muted); line-height: 1.6; }
.td-practice-btn {
  width: 100%; margin-top: 16px; padding: 13px;
  border-radius: var(--r); border: none; background: var(--ac);
  color: #fff; font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: opacity .2s;
}
.td-practice-btn:hover { opacity: .85; }

/* PRACTICE */
.practice-wrap { padding: 14px; }
.topic-select {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 10px 14px; color: var(--text);
  font-family: 'Heebo', sans-serif; font-size: 13px; margin-bottom: 14px; appearance: none;
}
.q-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; margin-bottom: 12px; }
.q-meta { font-size: 10px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.ai-tag { background: rgba(167,139,250,.15); color: var(--accent2); padding: 2px 8px; border-radius: 10px; font-size: 10px; }
.q-type-tag { background: rgba(79,195,247,.1); color: var(--accent); padding: 2px 8px; border-radius: 10px; font-size: 10px; }
.q-text { font-size: 15px; font-weight: 600; line-height: 1.5; margin-bottom: 14px; }
.opts { display: flex; flex-direction: column; gap: 7px; }
.opt {
  padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--text); font-family: 'Heebo', sans-serif;
  font-size: 13px; cursor: pointer; text-align: right; transition: all .2s;
}
.opt:hover:not(.disabled) { border-color: var(--ac); background: rgba(255,255,255,.04); }
.opt.correct { border-color: var(--green); background: rgba(86,211,100,.1); color: var(--green); }
.opt.wrong { border-color: var(--red); background: rgba(248,81,73,.1); color: var(--red); }
.opt.disabled { pointer-events: none; }
.explanation { margin-top: 12px; padding: 10px 14px; background: rgba(255,255,255,.04); border-radius: 8px; font-size: 12px; color: var(--muted); line-height: 1.6; border-right: 3px solid var(--ac); }
.next-btn { width: 100%; margin-top: 10px; padding: 13px; border-radius: 8px; border: none; background: var(--ac); color: #fff; font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }
.next-btn:hover { opacity: .85; }
.score-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; text-align: center; margin-bottom: 12px; }
.score-big { font-size: 40px; font-weight: 900; color: var(--ac); }
.score-sub { font-size: 12px; color: var(--muted); }
.spinner { display: flex; justify-content: center; padding: 28px; }
.spinner::after { content: ''; width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent2); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* FEED */
.feed-list { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.feed-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; transition: border-color .2s; }
.feed-card:hover { border-color: var(--ac); }
.feed-body { padding: 14px 16px; }
.feed-tag { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,.07); color: var(--muted); margin-bottom: 6px; }
.feed-date { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
.feed-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; }
.feed-desc { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
.feed-link { font-size: 12px; color: var(--ac); text-decoration: none; font-weight: 600; }
.feed-link:hover { text-decoration: underline; }
.feed-actions { display: flex; gap: 8px; padding: 8px 16px; border-top: 1px solid var(--border); }
.react-btn { background: transparent; border: 1px solid var(--border); border-radius: 16px; padding: 4px 10px; font-family: 'Heebo', sans-serif; font-size: 11px; color: var(--muted); cursor: pointer; transition: all .2s; }
.react-btn:hover, .react-btn.on { border-color: var(--ac); color: var(--ac); }
.share-btn { background: none; border: none; font-family: 'Heebo', sans-serif; font-size: 11px; color: var(--muted); cursor: pointer; margin-right: auto; }
.share-btn:hover { color: var(--ac); }
.comments-area { padding: 0 16px 12px; }
.comment-item { font-size: 11px; color: var(--muted); padding: 5px 0; border-bottom: 1px solid var(--border); }
.comment-form { display: flex; gap: 6px; margin-top: 8px; }
.comment-inp { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; color: var(--text); font-family: 'Heebo', sans-serif; font-size: 12px; }
.comment-inp:focus { outline: none; border-color: var(--ac); }
.comment-send { background: var(--ac); border: none; border-radius: 8px; padding: 7px 12px; color: #fff; font-family: 'Heebo', sans-serif; font-size: 12px; cursor: pointer; }

/* TEACHER PANEL */
.t-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.7); backdrop-filter: blur(4px); align-items: flex-end; justify-content: center; }
.t-overlay.on { display: flex; }
.t-sheet { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; padding: 20px 18px 30px; animation: slideUp .3s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.t-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.t-header h3 { font-size: 18px; font-weight: 900; }
.t-close { background: var(--surface2); border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; color: var(--text); font-size: 16px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
.form-ctrl { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px; }
.form-ctrl:focus { outline: none; border-color: var(--accent2); }
textarea.form-ctrl { min-height: 70px; resize: vertical; }
.t-submit { width: 100%; padding: 13px; border: none; background: linear-gradient(135deg, #a78bfa, #7c3aed); color: #fff; font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 4px; }
.t-submit:hover { opacity: .9; }
.t-section { font-size: 11px; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; padding: 18px 0 10px; }
.pass-wrap { text-align: center; padding: 10px 0; }
.pass-wrap h3 { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
.pass-row { display: flex; gap: 6px; }
.pass-inp { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--text); font-family: 'Heebo', sans-serif; font-size: 13px; }
.pass-go { background: var(--accent2); border: none; border-radius: 8px; padding: 9px 14px; color: #fff; font-family: 'Heebo', sans-serif; cursor: pointer; }
.pass-err { color: var(--red); font-size: 11px; margin-top: 6px; }

.empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
.empty .icon { font-size: 36px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">אזרחות <em>מעיין שחר</em></div>
  <button class="teacher-btn" onclick="openTeacher()">🔐 מורה</button>
</div>

<!-- HOME -->
<div id="s-home" class="screen on">
  <div class="hero">
    <h1>שלום 👋<br>בחר את כיתתך</h1>
    <p>חומר לימוד, תרגול ועדכוני המורה</p>
  </div>
  <div class="class-cards">
    <div class="class-card c11" onclick="openClass('11')">
      <div class="grade">י״א</div>
      <div class="grade-label">לאומיות וזכויות</div>
      <div class="grade-badge">תכנית חדשה</div>
    </div>
    <div class="class-card c12" onclick="openClass('12')">
      <div class="grade">י״ב</div>
      <div class="grade-label">תכנית ישנה</div>
      <div class="grade-badge">בקרוב</div>
    </div>
  </div>
  <div class="sec-label">עדכוני המורה</div>
  <div class="feed-preview" id="home-feed"></div>
</div>

<!-- CLASS -->
<div id="s-class" class="screen">
  <div class="class-header">
    <div class="back" onclick="goHome()">← חזרה</div>
    <h2 id="cls-title"></h2>
    <p id="cls-sub"></p>
  </div>
  <div class="tabs" id="cls-tabs">
    <button class="tab on" onclick="switchTab('topics')">📚 נושאים</button>
    <button class="tab" onclick="switchTab('practice')">✏️ תרגול</button>
    <button class="tab" onclick="switchTab('feed')">📰 עדכונים</button>
  </div>

  <div id="panel-topics" class="panel on">
    <div id="topics-container"></div>
  </div>
  <div id="panel-practice" class="panel">
    <div class="practice-wrap">
      <select class="topic-select" id="prac-select" onchange="startPractice()">
        <option value="">— בחר נושא לתרגול —</option>
      </select>
      <div id="prac-content"></div>
    </div>
  </div>
  <div id="panel-feed" class="panel">
    <div id="cls-feed" class="feed-list"></div>
  </div>
</div>

<!-- TEACHER PANEL -->
<div id="t-panel" class="t-overlay" onclick="overlayClick(event)">
  <div class="t-sheet">
    <div id="t-pass">
      <div class="pass-wrap">
        <h3>🔐 כניסת מורה</h3>
        <div class="pass-row">
          <input type="password" class="pass-inp" id="pass-in" placeholder="סיסמה" onkeydown="if(event.key==='Enter')checkPass()">
          <button class="pass-go" onclick="checkPass()">כניסה</button>
        </div>
        <div class="pass-err" id="pass-err"></div>
      </div>
    </div>
    <div id="t-main" style="display:none">
      <div class="t-header">
        <h3>🛠 פאנל מורה</h3>
        <button class="t-close" onclick="closeTeacher()">×</button>
      </div>

      <div class="t-section">➕ פרסום עדכון</div>
      <div class="form-group"><label>כיתה</label>
        <select class="form-ctrl" id="t-cls"><option value="both">שתיהן</option><option value="11">י״א</option><option value="12">י״ב</option></select>
      </div>
      <div class="form-group"><label>כותרת</label><input class="form-ctrl" id="t-ttl" type="text" placeholder="כותרת העדכון"></div>
      <div class="form-group"><label>תיאור</label><textarea class="form-ctrl" id="t-dsc" placeholder="פירוט קצר..."></textarea></div>
      <div class="form-group"><label>קישור (אופציונלי)</label><input class="form-ctrl" id="t-url" type="url" placeholder="https://..."></div>
      <div class="form-group"><label>תגית</label><input class="form-ctrl" id="t-tag" type="text" placeholder="כתבה / וידאו / פסיקה..."></div>
      <button class="t-submit" onclick="addUpdate()">פרסם עדכון</button>

      <div class="t-section">📎 הוספת קישור לנושא (י״א)</div>
      <div class="form-group"><label>נושא</label>
        <select class="form-ctrl" id="t-tp-sel"></select>
      </div>
      <div class="form-group"><label>תווית</label><input class="form-ctrl" id="t-lbl" type="text" placeholder="מצגת / מאמר..."></div>
      <div class="form-group"><label>קישור</label><input class="form-ctrl" id="t-lnk" type="url" placeholder="https://..."></div>
      <button class="t-submit" onclick="addLink()">הוסף קישור</button>

      <div class="t-section">❓ הוספת שאלת תרגול (י״א)</div>
      <div class="form-group"><label>נושא</label><select class="form-ctrl" id="t-q-tp"></select></div>
      <div class="form-group"><label>שאלה</label><textarea class="form-ctrl" id="t-q-txt" placeholder="כתוב את השאלה..."></textarea></div>
      <div class="form-group"><label>תשובה א</label><input class="form-ctrl" id="t-q-a" type="text"></div>
      <div class="form-group"><label>תשובה ב</label><input class="form-ctrl" id="t-q-b" type="text"></div>
      <div class="form-group"><label>תשובה ג</label><input class="form-ctrl" id="t-q-c" type="text"></div>
      <div class="form-group"><label>תשובה ד</label><input class="form-ctrl" id="t-q-d" type="text"></div>
      <div class="form-group"><label>תשובה נכונה</label>
        <select class="form-ctrl" id="t-q-ans"><option value="0">א</option><option value="1">ב</option><option value="2">ג</option><option value="3">ד</option></select>
      </div>
      <div class="form-group"><label>הסבר (אופציונלי)</label><textarea class="form-ctrl" id="t-q-exp" placeholder="הסבר לתשובה..."></textarea></div>
      <button class="t-submit" onclick="addQuestion()">הוסף שאלה</button>
    </div>
  </div>
</div>

<script>
const PASS = "maayan2025";
let teacherIn = false;
let curClass = null;
let curTab = 'topics';
let pracQs = [], pracIdx = 0, pracScore = 0, pracAnswered = false;
let topicDetailMode = false;

// ── BUILT-IN DATA ──────────────────────────────────────────────
const TOPICS_11 = [
  {
    id: 0, name: "הרקע ההיסטורי להקמת המדינה",
    desc: "הצהרת בלפור, כתב המנדט, והחלטה 181 של האו\"ם — הבסיס הבינלאומי להקמת המדינה",
    concepts: [
      { title: "הצהרת בלפור (1917)", body: "מכתב שר החוץ הבריטי ללורד רוטשילד — הבטחה לקדם הקמת בית לאומי לעם היהודי בארץ ישראל." },
      { title: "כתב המנדט (1922)", body: "הסמכה לבריטניה על ידי חבר הלאומים לשלוט בארץ ישראל ולממש את הצהרת בלפור, תוך שמירה על זכויות לא-יהודים." },
      { title: "החלטה 181 — תוכנית החלוקה (1947)", body: "החלטת עצרת האו\"ם להקים מדינה יהודית ומדינה ערבית. ירושלים תחת שליטה בינלאומית. ההנהגה היהודית קיבלה; הערבים דחו." }
    ],
    links: []
  },
  {
    id: 1, name: "הכרזת העצמאות",

function s(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function g(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){return d;} }

let questions11 = g('cv_q11', BUILTIN_QS);

// ── NAV ────────────────────────────────────────────────────────
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); document.getElementById(id).classList.add('on'); }

function openClass(cls){
  curClass = cls;
  const ac = cls==='11'?'var(--accent)':'#f06292';
  document.getElementById('cls-title').textContent = cls==='11'?'כיתה י״א':'כיתה י״ב';
  document.getElementById('cls-sub').textContent = cls==='11'?'לאומיות וזכויות':'תכנית ישנה';
  // set tab colors
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.remove('t11','t12');
    t.classList.add('t'+cls);
  });
  switchTab('topics');
  show('s-class');
  if(cls==='11') renderTopics11();
  else renderTopics12();
  renderFeed('cls-feed');
}

function goHome(){ show('s-home'); renderHomeFeed(); }

function switchTab(tab){
  curTab = tab;
  const tabs = ['topics','practice','feed'];
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on', tabs[i]===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('panel-'+tab).classList.add('on');
  if(tab==='practice') initPractice();
  if(tab==='feed') renderFeed('cls-feed');
}

// ── PRACTICE ───────────────────────────────────────────────────
function initPractice(){
  const sel = document.getElementById('prac-select');
  if(curClass==='12'){ document.getElementById('prac-content').innerHTML='<div class="empty"><div class="icon">✏️</div>תרגול י״ב בקרוב</div>'; sel.style.display='none'; return; }
  sel.style.display='block';
  sel.innerHTML = '<option value="">— בחר נושא לתרגול —</option>' +
    topics11.map((t,i)=>`<option value="${i}">פרק ${i+1}: ${t.name}</option>`).join('');
  document.getElementById('prac-content').innerHTML = '';
}

function startPractice(){
  const idx = document.getElementById('prac-select').value;
  if(idx==='') { document.getElementById('prac-content').innerHTML=''; return; }
  const qs = (questions11[idx]||[]).slice();
  pracQs = qs; pracIdx = 0; pracScore = 0;
  showQ(parseInt(idx));
}

function showQ(topicIdx){
  if(pracIdx < pracQs.length){
    renderQ(pracQs[pracIdx], topicIdx);
  } else {
    // AI question
    const el = document.getElementById('prac-content');
    el.innerHTML = '<div class="q-card"><div class="q-meta"><span class="ai-tag">✨ AI</span></div><div class="spinner"></div></div>';
    genAIQ(topicIdx);
  }
}

function renderQ(q, topicIdx){
  pracAnswered = false;
  const el = document.getElementById('prac-content');
  const isAI = q._ai;
  const showScore = pracIdx > 0;
  el.innerHTML = `
    ${showScore ? `<div class="score-card"><div class="score-big" style="color:var(--accent)">${pracScore}/${pracIdx}</div><div class="score-sub">ניקוד עד כה</div></div>` : ''}
    <div class="q-card">
      <div class="q-meta">
        <span>שאלה ${pracIdx+1}</span>
        ${q.type ? `<span class="q-type-tag">${q.type}</span>` : ''}
        ${isAI ? '<span class="ai-tag">✨ AI</span>' : ''}
      </div>
      <div class="q-text">${q.text}</div>
      <div class="opts" id="opts">
        ${q.options.map((o,i)=>`<button class="opt" onclick="checkAns(${i},${q.correct},this,${topicIdx})">${'אבגד'[i]}. ${o}</button>`).join('')}
      </div>
      <div id="exp" style="display:none" class="explanation">${q.explanation||''}</div>
    </div>
    <button class="next-btn" id="nxt" style="display:none;background:var(--accent)" onclick="nextQ(${topicIdx})">שאלה הבאה ←</button>
  `;
}

function checkAns(chosen, correct, btn, topicIdx){
  if(pracAnswered) return;
  pracAnswered = true;
  document.querySelectorAll('.opt').forEach((o,i)=>{
    o.classList.add('disabled');
    if(i===correct) o.classList.add('correct');
    else if(i===chosen) o.classList.add('wrong');
  });
  if(chosen===correct) pracScore++;
  const exp = document.getElementById('exp');
  if(exp && exp.textContent.trim()) exp.style.display='block';
  const nxt = document.getElementById('nxt');
  if(nxt) nxt.style.display='block';
}

function nextQ(topicIdx){
  pracIdx++;
  showQ(topicIdx);
}

async function genAIQ(topicIdx){
  const topicName = topics11[topicIdx]?.name || '';
  const prompt = `אתה מומחה לאזרחות ישראלית. צור שאלת בגרות בסגנון שאלת אירוע לנושא: "${topicName}".
החזר JSON תקין בלבד (ללא markdown):
{"text":"השאלה","options":["א","ב","ג","ד"],"correct":0,"explanation":"הסבר"}
הוסף קטע מציאותי קצר כרקע לשאלה, ואז שאל לזיהוי המושג/העקרון.`;
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:prompt}]})
    });
    const d = await r.json();
    const raw = (d.content||[]).find(c=>c.type==='text')?.text||'';
    const q = JSON.parse(raw.replace(/```json|```/g,'').trim());
    q._ai = true;
    pracQs.push(q);
    renderQ(q, topicIdx);
  } catch(e){
    document.getElementById('prac-content').innerHTML=`<div class="empty"><div class="icon">⚠️</div>לא הצלחתי לטעון שאלת AI<br><br><button class="next-btn" onclick="showQ(${topicIdx})" style="width:auto;padding:10px 20px;background:var(--accent)">נסה שוב</button></div>`;
  }
}

  let items = feed.filter(f=>{
    if(containerId==='home-feed') return true;
    return f.cls==='both' || f.cls===curClass;
  });
  if(limit) items = items.slice(0,limit);
  if(!items.length){ el.innerHTML='<div class="empty"><div class="icon">📰</div>אין עדכונים עדיין</div>'; return; }
  el.innerHTML = items.map((item,i)=>`
    <div class="feed-card" style="--ac:${curClass==='12'?'#f06292':'var(--accent)'}">
      <div class="feed-body">
        ${item.tag?`<span class="feed-tag">${item.tag}</span>`:''}
        <div class="feed-date">${item.date} · ${item.cls==='both'?'לשתי הכיתות':'כיתה י"'+item.cls}</div>
        <div class="feed-title">${item.title}</div>
        <div class="feed-desc">${item.desc}</div>
        ${item.url?`<a class="feed-link" href="${item.url}" target="_blank">קרא עוד →</a>`:''}
      </div>
      <div class="feed-actions">
        <button class="react-btn ${item.r?.like?'on':''}" onclick="react(${i},'like','${containerId}')">👍 ${item.r?.like||0}</button>
        <button class="react-btn ${item.r?.fire?'on':''}" onclick="react(${i},'fire','${containerId}')">🔥 ${item.r?.fire||0}</button>
        <button class="react-btn" onclick="toggleCmt(${i},'${containerId}')">💬 ${(item.cmts||[]).length}</button>
        <button class="share-btn" onclick="shareItem(${i})">⬆️ שתף</button>
      </div>
      <div id="cmt-${containerId}-${i}" style="display:none" class="comments-area">
        <div>${(item.cmts||[]).map(c=>`<div class="comment-item">💬 ${c}</div>`).join('')}</div>
        <div class="comment-form">
          <input class="comment-inp" id="ci-${containerId}-${i}" placeholder="הגב..." onkeydown="if(event.key==='Enter')submitCmt(${i},'${containerId}')">
          <button class="comment-send" onclick="submitCmt(${i},'${containerId}')">שלח</button>
        </div>
      </div>
    </div>
  `).join('');
}

function renderHomeFeed(){ renderFeed('home-feed',3); }
function react(i,type,cid){ if(!feed[i].r) feed[i].r={}; feed[i].r[type]=(feed[i].r[type]||0)+1; saveAll(); renderFeed(cid); }
function toggleCmt(i,cid){ const el=document.getElementById(`cmt-${cid}-${i}`); el.style.display=el.style.display==='none'?'block':'none'; }
function submitCmt(i,cid){ const inp=document.getElementById(`ci-${cid}-${i}`); const t=inp.value.trim(); if(!t)return; if(!feed[i].cmts)feed[i].cmts=[]; feed[i].cmts.push(t); inp.value=''; saveAll(); renderFeed(cid); setTimeout(()=>{ const el=document.getElementById(`cmt-${cid}-${i}`); if(el)el.style.display='block'; },30); }
function shareItem(i){ const f=feed[i]; if(navigator.share){navigator.share({title:f.title,text:f.desc,url:f.url||location.href});}else{navigator.clipboard.writeText(f.url||location.href); alert('הקישור הועתק!');} }

// ── TEACHER ────────────────────────────────────────────────────
function openTeacher(){ document.getElementById('t-panel').classList.add('on'); fillTeacherSelects(); }
function closeTeacher(){ document.getElementById('t-panel').classList.remove('on'); }
function overlayClick(e){ if(e.target===document.getElementById('t-panel')) closeTeacher(); }
function checkPass(){
  if(document.getElementById('pass-in').value===PASS){
    teacherIn=true;
    document.getElementById('t-pass').style.display='none';
    document.getElementById('t-main').style.display='block';
    fillTeacherSelects();
  } else { document.getElementById('pass-err').textContent='סיסמה שגויה'; }
}
function fillTeacherSelects(){
  const opts = topics11.map((t,i)=>`<option value="${i}">פרק ${i+1}: ${t.name}</option>`).join('');
  ['t-tp-sel','t-q-tp'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML=opts; });
}
function addUpdate(){
  const t=v('t-ttl'), d=v('t-dsc');
  if(!t||!d){alert('מלא כותרת ותיאור');return;}
  const now=new Date();
  feed.unshift({title:t,desc:d,url:v('t-url'),tag:v('t-tag'),cls:v('t-cls'),date:now.toLocaleDateString('he-IL'),r:{},cmts:[]});
  saveAll(); ['t-ttl','t-dsc','t-url','t-tag'].forEach(id=>document.getElementById(id).value='');
  renderHomeFeed(); if(curClass) renderFeed('cls-feed');
  alert('✅ פורסם!');
}
function addLink(){
  const idx=v('t-tp-sel'), lbl=v('t-lbl'), lnk=v('t-lnk');
  if(!lbl||!lnk){alert('מלא תווית וקישור');return;}
  topics11[idx].links.push({label:lbl,url:lnk});
  saveAll(); ['t-lbl','t-lnk'].forEach(id=>document.getElementById(id).value='');
  if(curClass==='11') renderTopics11();
  alert('✅ הקישור נוסף!');
}
function addQuestion(){
  const idx=v('t-q-tp'), txt=v('t-q-txt'), a=v('t-q-a'), b=v('t-q-b'), c=v('t-q-c'), d_=v('t-q-d');
  if(!txt||!a||!b||!c||!d_){alert('מלא את כל השדות');return;}
  if(!questions11[idx]) questions11[idx]=[];
  questions11[idx].push({text:txt,options:[a,b,c,d_],correct:parseInt(v('t-q-ans')),explanation:v('t-q-exp'),type:'ידע'});
  saveAll(); ['t-q-txt','t-q-a','t-q-b','t-q-c','t-q-d','t-q-exp'].forEach(id=>document.getElementById(id).value='');
  alert('✅ השאלה נוספה!');
}
function v(id){ const el=document.getElementById(id); return el?el.value.trim():''; }

// ── INIT ───────────────────────────────────────────────────────
renderHomeFeed();
</script>
